version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: house_price_prediction_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=enterprise-prod-secret-key-2026
      - DATABASE_PATH=/app/instance/house_prices.sqlite
      - PORT=5000
    volumes:
      - ./instance:/app/instance
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

